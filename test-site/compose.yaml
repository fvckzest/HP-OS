services:
  test-site:
    build: .
    init: true
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      TEST_SITE_CONTAINER: "true"
      TEST_SITE_PORT: "3100"
      HPOS_ORIGIN: "${FAKE_LMNL_HPOS_ORIGIN:-http://host.docker.internal:3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - test-site-evidence:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  test-site-evidence:
